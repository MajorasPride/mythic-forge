<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mythic Forge</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1c1e; color: #e8e8e8; font-family: system-ui, sans-serif; overflow: hidden; }
  #view { position: absolute; inset: 0; }
  #top { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px; font-size: 15px; display: flex; justify-content: space-between; pointer-events: none; }
  #top small { opacity: .6; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; background: #1c1c1ecc; }
  button { font: inherit; font-size: 16px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #4a4a4e; background: #2c2c30; color: #eee; }
  button.on { background: #e8e8e8; color: #1c1c1e; border-color: #e8e8e8; }
  #body { position: absolute; left: 0; right: 0; bottom: 68px; max-height: 55%; overflow-y: auto; padding: 12px 16px; background: #1c1c1ef2; display: none; }
  #body.open { display: block; }
  #presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  #presets button { min-height: 38px; font-size: 14px; padding: 0 12px; }
  .row { display: grid; grid-template-columns: 120px 1fr 40px; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; }
  .row input { width: 100%; accent-color: #e8e8e8; }
</style>
</head>
<body>
<div id="view"></div>
<div id="top"><span>Mythic Forge</span><small>Phase 2 · Mech frame</small></div>
<div id="body"><div id="presets"></div><div id="sliders"></div></div>
<div id="bar">
  <span id="moves" style="display: contents"></span>
  <button id="bodyBtn">Body</button>
  <button id="bones" class="on">Bones</button>
</div>

<!-- the mech frame (bones + stand-in blocks + moves), made in Blender -->
<script src="models/mech_standard.js"></script>
<!-- the frame math: sliders in, bone positions and block sizes out -->
<script src="frame.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- 1. the stage: renderer, camera, light, floor
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.getElementById('view').append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
camera.position.set(14, 8, 16);
const controls = new OrbitControls(camera, renderer.domElement);   // drag to turn, pinch to zoom
controls.target.set(0, 5, 0); controls.update();
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(5, 10, 7); scene.add(sun);
scene.add(new THREE.GridHelper(30, 30, 0x555555, 0x333333));
function fit() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', fit); fit();

// ---- 2. load the mech frame
const bytes = Uint8Array.from(atob(window.MF_MODELS.mech_standard), c => c.charCodeAt(0)).buffer;
let mixer, current, skeletonLines;
const moves = {};
const PLAY_ONCE = new Set(['punch']);          // moves that play once, the rest loop
const ORDER = ['idle', 'walk', 'run', 'punch'];
const F = window.MF_FRAME;
const bones = {};                               // 'thigh.L' -> the bone
const fromBlender = ([x, y, z]) => new THREE.Vector3(x, z, -y);   // Blender is z-up, three.js is y-up
const blockMat = new THREE.MeshStandardMaterial({ color: 0x9a9890, flatShading: true });
let params = F.withPreset('standard');

new GLTFLoader().parse(bytes, '', gltf => {
  const mech = gltf.scene;
  scene.add(mech);
  mech.updateMatrixWorld(true);
  mech.traverse(o => {
    if (o.isSkinnedMesh) o.visible = false;      // we draw our own blocks so they can change size
    if (o.isBone) bones[o.name.replace(/(L|R)$/, m => (/[a-z_]$/.test(o.name.slice(0, -1)) ? '.' : '') + m)] = o;
  });
  window.__bones = bones;
  for (const b of Object.values(bones)) b.userData.restQ = b.getWorldQuaternion(new THREE.Quaternion());
  bones.pelvis.userData.parentInv = bones.pelvis.parent.matrixWorld.clone().invert();
  skeletonLines = new THREE.SkeletonHelper(mech);        // shows the bones
  skeletonLines.material.depthTest = false;
  scene.add(skeletonLines);
  mixer = new THREE.AnimationMixer(mech);
  gltf.animations.forEach(clip => moves[clip.name] = mixer.clipAction(clip));
  shape(F.withPreset('standard'), true);                 // remember the Standard positions
  shape(params);
  ORDER.filter(n => moves[n]).forEach(addMoveButton);
  play('idle');
});

// ---- 2b. reshape the frame from the sliders: move each joint, resize each block
function shape(p, isStandard = false) {
  const f = F.build(p);
  for (const [name, bone] of Object.entries(bones)) {
    const d = f[name]; if (!d) continue;
    const head = fromBlender(d.head), tail = fromBlender(d.tail);
    // where this joint sits, measured from its parent joint (in the parent's own direction)
    let local;
    if (name === 'pelvis') local = head.clone().applyMatrix4(bone.userData.parentInv);
    else {
      const pname = Object.keys(bones).find(n => bones[n] === bone.parent);
      local = head.clone().sub(fromBlender(f[pname].head)).applyQuaternion(bones[pname].userData.restQ.clone().invert());
    }
    if (isStandard) { bone.userData.stdPos = local; continue; }
    bone.userData.basePos = local;
    // the stand-in block runs from this joint to the bone's tip
    const tip = tail.clone().sub(head).applyQuaternion(bone.userData.restQ.clone().invert());
    if (bone.userData.block) bone.remove(bone.userData.block);
    const [w, dep] = d.size;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, Math.max(tip.length(), .1), dep), blockMat);
    box.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tip.clone().normalize());
    box.position.copy(tip).multiplyScalar(.5);
    bone.add(box); bone.userData.block = box;
  }
  // keep the whole mech in view: aim at its middle, back off for tall mechs
  const top = f.head.tail[2], dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.set(0, top * .5, 0);
  camera.position.copy(controls.target).addScaledVector(dir, Math.max(top * 2.3, 14));
  controls.update();
}
// moves were made on the Standard frame: keep each joint's move, but at its new spot
function keepShape() {
  for (const b of Object.values(bones)) if (b.userData.basePos) b.position.add(b.userData.basePos).sub(b.userData.stdPos);
}

// ---- 2c. the Body panel: presets + sliders
const sliderEls = {};
for (const name of Object.keys(F.PRESETS)) {
  const b = document.createElement('button'); b.textContent = name[0].toUpperCase() + name.slice(1); b.dataset.preset = name;
  b.onclick = () => { params = F.withPreset(name); syncSliders(); shape(params); markPreset(name); };
  document.getElementById('presets').append(b);
}
for (const [key, label, min, max] of F.SLIDERS) {
  const row = document.createElement('label'); row.className = 'row';
  row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="0.01"><b></b>`;
  const input = row.querySelector('input'), out = row.querySelector('b');
  input.oninput = () => { params[key] = +input.value; out.textContent = (+input.value).toFixed(2); shape(params); markPreset(null); };
  sliderEls[key] = [input, out];
  document.getElementById('sliders').append(row);
}
function syncSliders() { for (const [k, [i, o]] of Object.entries(sliderEls)) { i.value = params[k]; o.textContent = params[k].toFixed(2); } }
function markPreset(n) { document.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('on', b.dataset.preset === n)); }
syncSliders(); markPreset('standard');
document.getElementById('bodyBtn').onclick = e => e.target.classList.toggle('on', document.getElementById('body').classList.toggle('open'));

// ---- 3. moves
function play(name) {
  const next = moves[name];
  next.reset();
  next.setLoop(PLAY_ONCE.has(name) ? THREE.LoopOnce : THREE.LoopRepeat);
  next.clampWhenFinished = true;
  next.play();
  if (current && current !== next) current.crossFadeTo(next, 0.25, false);   // smooth switch
  current = next;
  document.querySelectorAll('[data-move]').forEach(b => b.classList.toggle('on', b.dataset.move === name));
}
function addMoveButton(name) {
  const b = document.createElement('button');
  b.textContent = name[0].toUpperCase() + name.slice(1);
  b.dataset.move = name;
  b.onclick = () => play(name);
  document.getElementById('moves').append(b);
}
document.getElementById('bones').onclick = e => {
  skeletonLines.visible = !skeletonLines.visible;
  e.target.classList.toggle('on', skeletonLines.visible);
};

// ---- 4. the loop
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  if (mixer) {
    for (const b of Object.values(bones)) if (b.userData.stdPos) b.position.copy(b.userData.stdPos);   // start from Standard
    mixer.update(clock.getDelta());   // play the move
    keepShape();                      // then shift every joint to this mech's shape
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
