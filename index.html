<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mythic Forge</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1c1e; color: #e8e8e8; font-family: system-ui, sans-serif; overflow: hidden; }
  #view { position: absolute; inset: 0; }
  #top { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px; font-size: 15px; display: flex; justify-content: space-between; pointer-events: none; }
  #top small { opacity: .6; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; background: #1c1c1ecc; }
  button { font: inherit; font-size: 16px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #4a4a4e; background: #2c2c30; color: #eee; }
  button.on { background: #e8e8e8; color: #1c1c1e; border-color: #e8e8e8; }
  #body { position: absolute; left: 0; right: 0; bottom: var(--bar, 68px); max-height: 55%; overflow-y: auto; padding: 12px 16px; background: #1c1c1ef2; display: none; }
  #body.open { display: block; }
  #presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  #presets button { min-height: 38px; font-size: 14px; padding: 0 12px; }
  .row { display: grid; grid-template-columns: 120px 1fr 40px; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; }
  .row input { width: 100%; accent-color: #e8e8e8; }
  #build { position: absolute; left: 0; right: 0; bottom: var(--bar, 68px); max-height: 60%; overflow-y: auto; padding: 12px 16px; background: #1c1c1ef2; display: none; font-size: 14px; }
  #build.open { display: block; }
  .line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .line button { min-height: 38px; font-size: 14px; padding: 0 12px; }
  select { font: inherit; font-size: 15px; min-height: 38px; border-radius: 8px; background: #2c2c30; color: #eee; border: 1px solid #4a4a4e; padding: 0 8px; }
  .sw { width: 36px; height: 36px; min-height: 36px; padding: 0; border-radius: 50%; }
  .hint { opacity: .65; margin: 0 0 10px; }
  #views { position: absolute; top: 40px; right: 8px; display: flex; flex-direction: column; gap: 6px; }
  #views button { min-height: 40px; min-width: 64px; font-size: 14px; padding: 0 10px; background: #2c2c30cc; touch-action: none; user-select: none; }
  #view canvas { touch-action: none; }
</style>
</head>
<body>
<div id="view"></div>
<div id="top"><span>Mythic Forge</span><small>Phase 3 · Body parts</small></div>
<div id="views"><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="angle">3/4</button><button data-view="back">Back</button><button data-hold="left" aria-label="Turn left">⟲</button><button data-hold="right" aria-label="Turn right">⟳</button><button data-hold="in" aria-label="Zoom in">＋</button><button data-hold="out" aria-label="Zoom out">－</button><button data-hold="up" aria-label="Look from higher">▲</button><button data-hold="down" aria-label="Look from lower">▼</button></div>
<div id="body"><div id="presets"></div><div id="sliders"></div></div>
<div id="build">
  <p class="hint" id="buildHint">Tap a spot on the mech (or pick it here), then pick a body part for it.</p>
  <div class="line"><span>Spot:</span><select id="bonePick"></select><button id="mirrorBtn" class="on">Mirror</button></div>
  <div class="line" id="choices"></div>
</div>
<div id="bar">
  <span id="moves" style="display: contents"></span>
  <button id="bodyBtn">Body</button>
  <button id="buildBtn">Build</button>
  <button id="bones" class="on">Bones</button>
</div>

<!-- the mech frame (bones + stand-in blocks + moves), made in Blender -->
<script src="models/mech_standard.js"></script>
<!-- the frame math: sliders in, bone positions and block sizes out -->
<script src="frame.js"></script>
<!-- body parts for every spot, made in Blender (tools/blender/parts_all.py) -->
<script src="models/parts_all.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';   // black toon outlines (three.js, MIT)

// ---- 1. the stage: renderer, camera, light, floor
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.getElementById('view').append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
camera.position.set(14, 8, 16);
const controls = new OrbitControls(camera, renderer.domElement);   // drag to turn, pinch to zoom
controls.target.set(0, 5, 0);
// easier on a phone: smooth drag, can't go under the floor or too far, 2 fingers = zoom + slide
controls.enableDamping = true; controls.dampingFactor = .12; controls.rotateSpeed = .8;
controls.minDistance = 5; controls.maxDistance = 60; controls.maxPolarAngle = Math.PI * .49;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.update();
// camera moves glide instead of jumping: set camTo = {target, pos} and the loop eases toward it
let camTo = null;
function glide(target, pos) { camTo = { target: target.clone(), pos: pos.clone() }; }
let mechTop = 10;
function viewAll(dirName) {
  const D = { front: [0, .15, 1], side: [1, .15, 0], angle: [.75, .3, .9], back: [0, .15, -1] }[dirName] || [.75, .3, .9];
  const t = new THREE.Vector3(0, mechTop * .5, 0), dir = new THREE.Vector3(...D).normalize();
  glide(t, t.clone().addScaledVector(dir, Math.max(mechTop * 2.3, 14)));
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => viewAll(b.dataset.view));
// press-and-hold buttons for phones (no fiddly finger dragging): turn, zoom, look higher/lower
let holding = null;
function nudge(dt) {
  if (!holding) return; camTo = null;
  const off = camera.position.clone().sub(controls.target), sph = new THREE.Spherical().setFromVector3(off), sp = 1.6 * dt;
  if (holding === 'left') sph.theta -= sp; if (holding === 'right') sph.theta += sp;
  if (holding === 'up') sph.phi = Math.max(.15, sph.phi - sp * .7); if (holding === 'down') sph.phi = Math.min(Math.PI * .49, sph.phi + sp * .7);
  if (holding === 'in') sph.radius = Math.max(controls.minDistance, sph.radius * (1 - dt * 1.2));
  if (holding === 'out') sph.radius = Math.min(controls.maxDistance, sph.radius * (1 + dt * 1.2));
  camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
}
document.querySelectorAll('[data-hold]').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); holding = b.dataset.hold; b.classList.add('on'); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => { holding = null; b.classList.remove('on'); });
});
scene.background = new THREE.Color(0x17181c);
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x30302c, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(6, 12, 8); scene.add(sun);
const rim = new THREE.DirectionalLight(0x8fb4ff, 1.6); rim.position.set(-8, 6, -10); scene.add(rim);   // rim light: makes the silhouette pop
// toon look: 3 flat bands of light instead of smooth shading, plus black outlines
const bands = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
bands.minFilter = bands.magFilter = THREE.NearestFilter; bands.needsUpdate = true;
const toon = (color, glow) => new THREE.MeshToonMaterial({ color, gradientMap: bands, emissive: glow ? color : 0x000000, emissiveIntensity: glow ? 1 : 0 });
const outline = new OutlineEffect(renderer, { defaultThickness: 0.006, defaultColor: [0, 0, 0] });
scene.add(new THREE.GridHelper(30, 30, 0x555555, 0x333333));
function fit() { document.body.style.setProperty('--bar', document.getElementById('bar').offsetHeight + 'px'); outline.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', fit); fit();

// ---- 2. load the mech frame
const bytes = Uint8Array.from(atob(window.MF_MODELS.mech_standard), c => c.charCodeAt(0)).buffer;
let mixer, current, skeletonLines;
const moves = {};
const PLAY_ONCE = new Set(['punch']);          // moves that play once, the rest loop
const ORDER = ['idle', 'walk', 'run', 'punch'];
const F = window.MF_FRAME;
const bones = {};                               // 'thigh.L' -> the bone
const fromBlender = ([x, y, z]) => new THREE.Vector3(x, z, -y);   // Blender is z-up, three.js is y-up
const blockMat = toon(0x8d8b85);
let params = F.withPreset('standard');

new GLTFLoader().parse(bytes, '', gltf => {
  const mech = gltf.scene;
  scene.add(mech);
  mech.updateMatrixWorld(true);
  mech.traverse(o => {
    if (o.isSkinnedMesh) o.visible = false;      // we draw our own blocks so they can change size
    if (o.isBone) bones[o.name.replace(/(L|R)$/, m => (/[a-z_]$/.test(o.name.slice(0, -1)) ? '.' : '') + m)] = o;
  });
  window.__bones = bones;
  for (const b of Object.values(bones)) b.userData.restQ = b.getWorldQuaternion(new THREE.Quaternion());
  bones.pelvis.userData.parentInv = bones.pelvis.parent.matrixWorld.clone().invert();
  skeletonLines = new THREE.SkeletonHelper(mech);        // shows the bones
  skeletonLines.material.depthTest = false;
  skeletonLines.material.userData.outlineParameters = { visible: false };
  scene.add(skeletonLines);
  mixer = new THREE.AnimationMixer(mech);
  gltf.animations.forEach(clip => moves[clip.name] = mixer.clipAction(clip));
  shape(F.withPreset('standard'), true);                 // remember the Standard positions
  shape(params);
  ORDER.filter(n => moves[n]).forEach(addMoveButton);
  fit();   // the button bar is taller now: keep panels above it
  const spotList = document.getElementById('bonePick');
  spotList.innerHTML = '<option value="">Pick a spot...</option>' + Object.keys(bones).map(n => `<option value="${n}">${NICE(n)}${LIBRARY[SLOT_OF(n)] ? '' : ' (soon)'}</option>`).join('');
  loadSaved();
  play('idle');
});

// ---- 2b. reshape the frame from the sliders: move each joint, resize each block
function shape(p, isStandard = false) {
  const f = F.build(p);
  for (const [name, bone] of Object.entries(bones)) {
    const d = f[name]; if (!d) continue;
    const head = fromBlender(d.head), tail = fromBlender(d.tail);
    // where this joint sits, measured from its parent joint (in the parent's own direction)
    let local;
    if (name === 'pelvis') local = head.clone().applyMatrix4(bone.userData.parentInv);
    else {
      const pname = Object.keys(bones).find(n => bones[n] === bone.parent);
      local = head.clone().sub(fromBlender(f[pname].head)).applyQuaternion(bones[pname].userData.restQ.clone().invert());
    }
    if (isStandard) { bone.userData.stdPos = local; continue; }
    bone.userData.basePos = local;
    // the stand-in block runs from this joint to the bone's tip
    const tip = tail.clone().sub(head).applyQuaternion(bone.userData.restQ.clone().invert());
    if (bone.userData.block) bone.remove(bone.userData.block);
    const [w, dep] = d.size;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, Math.max(tip.length(), .1), dep), blockMat);
    box.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tip.clone().normalize());
    box.position.copy(tip).multiplyScalar(.5);
    box.material = blockMat.clone(); box.userData.bone = name;      // each block knows its bone (for tapping)
    box.visible = !bone.userData.partId;
    bone.add(box); bone.userData.block = box;
    bone.userData.size = [w, tip.length(), dep]; bone.userData.tip = tip;
    bone.userData.restWorld = new THREE.Matrix4().compose(head, bone.userData.restQ, new THREE.Vector3(1, 1, 1));
  }
  // keep the whole mech in view: aim at its middle, back off for tall mechs
  const top = f.head.tail[2], dir = camera.position.clone().sub(controls.target).normalize();
  if (typeof refreshParts === 'function') refreshParts();   // body parts stretch to the new shape
  controls.target.set(0, top * .5, 0);
  camera.position.copy(controls.target).addScaledVector(dir, Math.max(top * 2.3, 14));
  controls.update();
}
// moves were made on the Standard frame: keep each joint's move, but at its new spot
function keepShape() {
  for (const b of Object.values(bones)) if (b.userData.basePos) b.position.add(b.userData.basePos).sub(b.userData.stdPos);
}

// ---- 2c. the Body panel: presets + sliders
const sliderEls = {};
for (const name of Object.keys(F.PRESETS)) {
  const b = document.createElement('button'); b.textContent = name[0].toUpperCase() + name.slice(1); b.dataset.preset = name;
  b.onclick = () => { params = F.withPreset(name); syncSliders(); shape(params); markPreset(name); save(); };
  document.getElementById('presets').append(b);
}
for (const [key, label, min, max] of F.SLIDERS) {
  const row = document.createElement('label'); row.className = 'row';
  row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="0.01"><b></b>`;
  const input = row.querySelector('input'), out = row.querySelector('b');
  input.oninput = () => { params[key] = +input.value; out.textContent = (+input.value).toFixed(2); shape(params); markPreset(null); save(); };
  sliderEls[key] = [input, out];
  document.getElementById('sliders').append(row);
}
function syncSliders() { for (const [k, [i, o]] of Object.entries(sliderEls)) { i.value = params[k]; o.textContent = params[k].toFixed(2); } }
function markPreset(n) { document.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('on', b.dataset.preset === n)); }
syncSliders(); markPreset('standard');
document.getElementById('bodyBtn').onclick = () => openPanel('body');


// ---- 2d. BUILD: body parts. Every spot on the frame (chest, head, arms...) is a slot. Tap a spot, pick a body part.
//      A body part is stretched to fit its spot, so it follows the Body sliders and moves with the mech.
//      Mirror ON = the same part on the other side too (for arms and legs, once they exist).
const NICE = n => { const t = n.replace(/\.[LR]$/, '').replace('_', ' '); return n.endsWith('.L') ? 'Left ' + t : n.endsWith('.R') ? 'Right ' + t : t[0].toUpperCase() + t.slice(1); };
const other = n => n.endsWith('.L') ? n.slice(0, -2) + '.R' : n.endsWith('.R') ? n.slice(0, -2) + '.L' : null;
const SLOT_OF = n => n.replace(/\.[LR]$/, '');                 // 'forearm.L' -> 'forearm'
const LIBRARY = window.MF_PARTS || {};                         // slot -> list of body parts
const loaded = {};                                             // part id -> loaded 3D model
let slots = {}, selBone = null, mirrorOn = true, building = false;

function loadPart(p, right) {
  const key = p.id + (right ? 'R' : 'L');
  if (loaded[key]) return Promise.resolve(loaded[key]);
  const bytes = Uint8Array.from(atob(right && p.glbR ? p.glbR : p.glb), c => c.charCodeAt(0)).buffer;
  return new Promise(res => new GLTFLoader().parse(bytes, '', g => {
    g.scene.traverse(m => { if (m.isMesh) { const glow = m.material.emissive && m.material.emissive.getHex() > 0;
      m.material = toon(m.material.color.getHex(), glow); } });
    loaded[key] = g.scene; res(g.scene);
  }));
}
async function setPart(boneName, id) {
  const b = bones[boneName];
  if (b.userData.part) b.remove(b.userData.part);
  b.userData.part = null; b.userData.partId = id || null;
  if (b.userData.block) b.userData.block.visible = !id;          // the gray stand-in shows only when the spot is empty
  slots[boneName] = id || null;
  if (!id) return;
  const p = LIBRARY[SLOT_OF(boneName)].find(q => q.id === id);
  const model = (await loadPart(p, boneName.endsWith('.R'))).clone();
  if (b.userData.partId !== id) return;                          // picked something else while loading
  const holder = new THREE.Group(); holder.add(model); holder.userData.p = p;
  b.add(holder); b.userData.part = holder; fitPart(boneName);
}
// Fit a part to its spot. Sizes from Blender are [width, depth, height]; three.js is y-up, so height -> y, depth -> z.
//   box:    stands straight up on the joint, stretched to the spot's box (chest, head, pelvis)
//   limb:   hangs from the joint along the bone, stretched to the bone's length and thickness
//   anchor: keeps the kit's own joint point, scaled to the mech's size (shoulder pads, feet)
const DOWN = new THREE.Vector3(0, -1, 0);
// keep each part's own shape: height/length fits exactly, width and depth may only stretch 20% away from it
const keep = (t, p, along) => Math.min(Math.max(t / p, along * .8), along * 1.2);
function fitPart(boneName) {
  const b = bones[boneName], h = b.userData.part; if (!h) return;
  const p = h.userData.p, [pw, pd, ph] = p.size, [w, len, d] = b.userData.size, model = h.children[0];
  const toWorld = b.userData.restQ, toBone = toWorld.clone().invert(), k = params.height, bulk = params.bulk;
  h.position.set(0, 0, 0);
  if (p.mode === 'box') { const sy = len / ph; h.quaternion.copy(toBone); model.scale.set(keep(w, pw, sy), sy, keep(d, pd, sy)); }
  else if (p.mode === 'limb') {
    const dir = b.userData.tip.clone().applyQuaternion(toWorld).normalize();
    h.quaternion.copy(toBone).multiply(new THREE.Quaternion().setFromUnitVectors(DOWN, dir));
    model.scale.set(w / pw, len / ph, d / pd);           // limbs: fill the bone (thickness is already set by the Thickness slider)
  } else if (SLOT_OF(boneName) === 'shoulder') {
    const S = 2.3 * k * Math.sqrt(bulk), out = boneName.endsWith('.R') ? -1 : 1;
    h.quaternion.copy(toBone); model.scale.setScalar(S);
    // the kit's shoulder point sits a little inside and above the arm's top: put it there
    h.position.copy(b.userData.tip).add(new THREE.Vector3(-.18 * S * out, .10 * S, 0).applyQuaternion(toBone));
  } else {                                                       // foot: ankle point, sole on the ground
    h.quaternion.copy(toBone); model.scale.set(1.1 * bulk * k / pw * 1.4, .63 * k / .22, 1.7 * Math.sqrt(bulk) * k / pd * 1.1);
  }
}
function refreshParts() { for (const n of Object.keys(bones)) fitPart(n); }
function pick(id) {
  if (!selBone) return hint('Tap a spot first');
  setPart(selBone, id);
  if (mirrorOn && other(selBone)) setPart(other(selBone), id);
  showChoices(); save();
}
function selectBone(n) {
  if (n === selBone) return;
  selBone = n;
  for (const [name, b] of Object.entries(bones)) if (b.userData.block) b.userData.block.material.color.set(name === n ? 0xd8823a : 0x8d8b85);
  document.getElementById('bonePick').value = n || '';
  showChoices();
  if (n) {   // zoom in on the picked spot, keeping the same viewing angle
    const p = new THREE.Vector3(); bones[n].getWorldPosition(p);
    const tip = bones[n].userData.tip.clone().applyQuaternion(bones[n].userData.restQ).multiplyScalar(.5); p.add(tip);
    const dir = camera.position.clone().sub(controls.target).normalize();
    glide(p, p.clone().addScaledVector(dir, Math.max(bones[n].userData.size[1] * 3.5, 7)));
  } else if (building === false) viewAll('angle');
}
function showChoices() {
  const box = document.getElementById('choices'); box.innerHTML = '';
  if (!selBone) return hint('Tap a spot on the mech (or pick it here), then pick a body part for it.');
  const list = LIBRARY[SLOT_OF(selBone)] || [];
  if (!list.length) return hint(NICE(selBone) + ': this spot is part of the frame (no body parts for it yet).');
  hint(NICE(selBone) + ': pick a body part.');
  const add = (label, id) => { const b = document.createElement('button'); b.textContent = label; b.classList.toggle('on', (slots[selBone] || null) === id);
    b.onclick = () => pick(id); box.append(b); };
  add('Frame only', null);
  list.forEach(p => add(p.name, p.id));
}
function hint(t) { document.getElementById('buildHint').textContent = t; }
document.getElementById('mirrorBtn').onclick = e => { mirrorOn = !mirrorOn; e.target.classList.toggle('on', mirrorOn); };
document.getElementById('bonePick').onchange = e => selectBone(e.target.value || null);

// tap (not drag) on the mech picks the spot
const ray = new THREE.Raycaster(), down = {};
renderer.domElement.addEventListener('pointerdown', e => { down.x = e.clientX; down.y = e.clientY; down.t = performance.now(); });
renderer.domElement.addEventListener('pointerup', e => {
  if (!building || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8 || performance.now() - down.t > 400) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const targets = []; for (const b of Object.values(bones)) b.traverse(o => { if (o.isMesh && o.visible) targets.push(o); });
  const hit = ray.intersectObjects(targets, false)[0];
  let o = hit && hit.object; while (o && !(o.isBone)) o = o.parent;      // climb up to the bone that owns what was tapped
  selectBone(o ? Object.keys(bones).find(n => bones[n] === o) : null);
});

// panels: only one open at a time
function openPanel(which) {
  for (const id of ['body', 'build']) {
    const open = id === which && !document.getElementById(id).classList.contains('open');
    document.getElementById(id).classList.toggle('open', open);
    document.getElementById(id + 'Btn').classList.toggle('on', open);
  }
  building = document.getElementById('build').classList.contains('open');
  if (!building) selectBone(null);
}
document.getElementById('buildBtn').onclick = () => openPanel('build');

// keep your build on this phone between visits (proper save + export comes later)
function save() { try { localStorage.setItem('mf-build2', JSON.stringify({ params, slots })); } catch (e) {} }
function loadSaved() {
  let d; try { d = JSON.parse(localStorage.getItem('mf-build2')); } catch (e) {}
  if (!d) return;
  if (d.params) { params = { ...F.STANDARD, ...d.params }; syncSliders(); markPreset(null); shape(params); }
  for (const [n, id] of Object.entries(d.slots || {})) if (id && bones[n]) setPart(n, id);
}

// ---- 3. moves
function play(name) {
  const next = moves[name];
  next.reset();
  next.setLoop(PLAY_ONCE.has(name) ? THREE.LoopOnce : THREE.LoopRepeat);
  next.clampWhenFinished = true;
  next.play();
  if (current && current !== next) current.crossFadeTo(next, 0.25, false);   // smooth switch
  current = next;
  document.querySelectorAll('[data-move]').forEach(b => b.classList.toggle('on', b.dataset.move === name));
}
function addMoveButton(name) {
  const b = document.createElement('button');
  b.textContent = name[0].toUpperCase() + name.slice(1);
  b.dataset.move = name;
  b.onclick = () => play(name);
  document.getElementById('moves').append(b);
}
document.getElementById('bones').onclick = e => {
  skeletonLines.visible = !skeletonLines.visible;
  e.target.classList.toggle('on', skeletonLines.visible);
};

// ---- 4. the loop
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  if (mixer) {
    for (const b of Object.values(bones)) if (b.userData.stdPos) b.position.copy(b.userData.stdPos);   // start from Standard
    mixer.update(clock.getDelta());   // play the move
    keepShape();                      // then shift every joint to this mech's shape
  }
  nudge(1 / 60);
  if (camTo) {
    controls.target.lerp(camTo.target, .15); camera.position.lerp(camTo.pos, .15);
    if (camera.position.distanceTo(camTo.pos) < .05) camTo = null;
  }
  controls.update();
  // when a panel is open, shift the picture up so the mech isn't hidden behind it
  const panel = document.querySelector('#body.open, #build.open'), lift = panel ? panel.offsetHeight / 2 : 0;
  if (lift) camera.setViewOffset(innerWidth, innerHeight, 0, lift, innerWidth, innerHeight); else camera.clearViewOffset();
  outline.render(scene, camera);
});
</script>
</body>
</html>
